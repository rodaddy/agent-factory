# The app's own rendered route: its hosts are self-claimed, never a conflict.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: linkedin-automation-prod-tls, namespace: linkedin-automation-prod }
spec:
  secretName: linkedin-automation-prod-tls
  dnsNames: [linkedin.example.net]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: linkedin-automation-prod, namespace: linkedin-automation-prod }
spec:
  routes:
    - kind: Rule
      match: Host(`linkedin.example.net`)
