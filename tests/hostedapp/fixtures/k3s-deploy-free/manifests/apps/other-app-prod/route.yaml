# Another app's route over hosts the fixture declaration does not name.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: other-app-prod, namespace: other-app-prod }
spec:
  routes:
    - kind: Rule
      match: Host(`other.example.net`) || Host(`www.other.example.net`)
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: other-app-prod-tls, namespace: other-app-prod }
spec:
  dnsNames: [certonly.example.net]
